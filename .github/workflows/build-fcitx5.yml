name: Build WechatOnCloud with Fcitx5

on:
  workflow_dispatch:
    inputs:
      upstream_version:
        description: 'Upstream WechatOnCloud Version'
        required: true
        default: '1.5.1'
  push:
    paths:
      - 'docker-fcitx5/**'
      - '.github/workflows/build-fcitx5.yml'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./docker-fcitx5
          file: ./docker-fcitx5/Dockerfile
          build-args: |
            UPSTREAM_TAG=${{ inputs.upstream_version || '1.5.1' }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/wechat-on-cloud:${{ inputs.upstream_version || '1.5.1' }}-fcitx5
            ghcr.io/${{ github.repository_owner }}/wechat-on-cloud:latest-fcitx5
